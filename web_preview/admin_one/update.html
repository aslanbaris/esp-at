                          id="fw_version">Loading...</b></span>

                    </div>

                <div class="field">

                    <div class="file has-name is-fullwidth">
                      <label class="file-label">
                        <input class="file-input" type="file" id="ota_file" accept=".bin"
                          onchange="fileChange(this, 'ota_file_display')">
                        <span class="file-cta">
                          <span class="file-icon">
                            <i class="mdi mdi-upload"></i>
                          </span>
                          <span class="file-label">
                            Choose a file…

    <script>
      // OTA Logic
      document.addEventListener('DOMContentLoaded', function () {
        getOTInfo();
      });

      function getOTInfo() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "/getotainfo", true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 304) {
              try {
                const resp = JSON.parse(xhr.responseText);
                if (resp.state === 0) {
                  document.getElementById('fw_version').textContent = resp.fw_version;
                  document.getElementById('at_version').textContent = resp.at_core_version;

                  const select = document.getElementById('partition_select');
                  select.innerHTML = '<option value="" disabled selected>Select Partition</option>'; // Reset
                  const partitions = resp.partitions || [];
                  partitions.forEach(function (part) {
                    const option = document.createElement('option');
                    option.value = part;
                    option.textContent = part;
                    select.appendChild(option);
                  });
                } else {
                  showError("Failed to get version info (State: " + resp.state + ")", 'error_msg', 'success_msg');
                }
              } catch (e) {
                showError("Failed to parse OTA info: " + e.message, 'error_msg', 'success_msg');
              }
            } else {
              showError("Failed to fetch OTA info (Status: " + xhr.status + ")", 'error_msg', 'success_msg');
            }
          }
        };
        xhr.send();
      }

      function fileChange(input, displayId) {
        const fileNameDisplay = document.getElementById(displayId);
        if (input.files && input.files.length > 0) {
          const file = input.files[0];
          fileNameDisplay.textContent = file.name;

          if (!file.name.toLowerCase().endsWith('.bin')) {
            // Determine which error message box to use based on input ID
            const errorId = (input.id === 'mcu_file') ? 'mcu_error_msg' : 'error_msg';
            const successId = (input.id === 'mcu_file') ? 'mcu_success_msg' : 'success_msg';

            showError("Please select a .bin file", errorId, successId);
            input.value = ""; // Clear input
            fileNameDisplay.textContent = "No file selected";
          } else {
            const errorId = (input.id === 'mcu_file') ? 'mcu_error_msg' : 'error_msg';
            hideError(errorId);
          }
        } else {
          fileNameDisplay.textContent = "No file selected";
        }
      }

      function startOTA() {
        const partition = document.getElementById('partition_select').value;
        const fileInput = document.getElementById('ota_file');

        if (!partition) {
          showError("Please select a partition.", 'error_msg', 'success_msg');
          return;
        }
        if (!fileInput.files || fileInput.files.length === 0) {
          showError("Please select a firmware file.", 'error_msg', 'success_msg');
          return;
        }

        performUpdate(fileInput.files[0], partition, 'btn_upgrade', 'ota_progress', 'error_msg', 'success_msg');
      }

      function startMCUUpdate() {
        // MCU Update specific logic. Assuming "mcu" as partition/object name for now.
        const fileInput = document.getElementById('mcu_file');

        if (!fileInput.files || fileInput.files.length === 0) {
          showError("Please select a firmware file.", 'mcu_error_msg', 'mcu_success_msg');
          return;
        }

        // Warning: This object name 'mcu' must be handled by the backend!
        performUpdate(fileInput.files[0], 'mcu', 'btn_mcu_upgrade', 'mcu_progress', 'mcu_error_msg', 'mcu_success_msg');
      }

      function performUpdate(file, partitionName, btnId, progressId, errorId, successId) {
        const btn = document.getElementById(btnId);
        const progress = document.getElementById(progressId);

        btn.classList.add('is-loading');
        btn.disabled = true;
        progress.classList.remove('is-hidden');
        progress.value = 0;
        hideError(errorId);
        hideSuccess(successId);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/setotadata", true);
        xhr.setRequestHeader("Content-Type", "application/octet-stream");
        xhr.setRequestHeader("Object", partitionName);

        xhr.upload.onprogress = function (e) {
          if (e.lengthComputable) {
            const percentComplete = (e.loaded / e.total) * 100;
            progress.value = percentComplete;
          }
        };

        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            btn.classList.remove('is-loading');
            btn.disabled = false;
            progress.classList.add('is-hidden');

            if (xhr.status === 200 || xhr.status === 304) {
              try {
                const resp = JSON.parse(xhr.responseText);
                if (resp.state === 0) {
                  if (partitionName === 'mcu') {
                    showSuccess("Upload Complete. Flashing MCU... (Please Wait)", successId, errorId);
                    triggerMCUFlash(successId, errorId);
                  } else {
                    showSuccess("Update Successful!", successId, errorId);
                  }
                } else {
                  showError("Update Failed (State: " + resp.state + ")", errorId, successId);
                }
              } catch (e) {
                showError("Invalid response from server.", errorId, successId);
              }
            } else {
              showError("Upload Failed (Status: " + xhr.status + ")", errorId, successId);
            }
          }
        };

        xhr.send(file);
      }

      function showError(msg, errorId, successId) {
        const el = document.getElementById(errorId);
        el.textContent = msg;
        el.style.display = 'block';
        if (successId) document.getElementById(successId).style.display = 'none';
      }

      function hideError(errorId) {
        document.getElementById(errorId).style.display = 'none';
      }

      function showSuccess(msg, successId, errorId) {
        const el = document.getElementById(successId);
        el.textContent = msg;
        el.style.display = 'block';
        if (errorId) document.getElementById(errorId).style.display = 'none';
      }

      function hideSuccess(successId) {
        document.getElementById(successId).style.display = 'none';
      }

      function triggerMCUFlash(successId, errorId) {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/update_mcu", true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              showSuccess("MCU Flash Initiated. System will restart...", successId, errorId);
            } else {
              showError("MCU Flash Trigger Failed!", errorId, successId);
            }
          }
        };
        xhr.send();
      }
    </script>
